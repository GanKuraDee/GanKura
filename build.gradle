plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { url = "https://maven.teamresourceful.com/repository/maven-public/" }
	maven { url = "https://maven.terraformersmc.com/releases" }
}

loom {
	splitEnvironmentSourceSets()

	// Loom は Gradle 同期のたびに .idea/runConfigurations を Gradle タスク型で作り直してしまう。
	// DevAuth の指定を入れた Application 型の実行構成を手で置いているので、生成を止めておく
	runs {
		client {
			ideConfigGenerated = false
		}
		server {
			ideConfigGenerated = false
		}
	}

	mods {
		"gankura" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// 開発中の一時的な機能 (com.deeply.gankura.dev)。
// jar を作るときだけソースから外し、IDE のビルドや runClient では入れる。
// これで IntelliJ から起動したときはそのまま使えて、配布用の jar には入らない。
// 明示的に入れたいときは -PdevFeatures、明示的に外したいときは -PnoDevFeatures を付ける
def jarTaskNames = ['build', 'jar', 'assemble', 'publish']
def buildingJar = gradle.startParameter.taskNames.any { taskName ->
	def lower = taskName.toLowerCase()
	jarTaskNames.any { lower.contains(it) }
}
def includeDevFeatures = project.hasProperty('devFeatures') ||
		(!project.hasProperty('noDevFeatures') && !buildingJar)

if (!includeDevFeatures) {
	sourceSets.client.java.exclude 'com/deeply/gankura/dev/**'
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// 設定画面と設定ファイルの読み書き。26.3 対応版が出ている
	implementation("com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-26.3:6.0.1")
	include("com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-26.3:6.0.1")

	// ModMenu の設定画面は ResourcefulConfig 側が用意する。
	// こちらから参照はしないが、開発中に動かして確かめられるよう実行時には入れておく
	implementation("com.terraformersmc:modmenu:21.0.0-beta.1")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}

	// LGPL は GPL 本文を参照する形になっているため、両方を同梱する
	from("COPYING") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
